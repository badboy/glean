name: Release

on:
  push:
    branches:
      - ci-gha-rust-test-only/swnzlmupmmru
    tags: ['v*']

# Drop all default GITHUB_TOKEN permissions; each job declares its own least-privilege set.
permissions: {}

env:
  MSRV: '1.90'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  #publish-rust:
  #  runs-on: ubuntu-latest
  #  environment: release
  #  permissions:
  #    id-token: write
  #  steps:
  #    - uses: actions/checkout@v6
  #    - uses: rust-lang/crates-io-auth-action@v1
  #      id: auth
  #    - name: Publish glean-core
  #      run: |
  #        cd glean-core
  #        cargo publish --verbose
  #      env:
  #        CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  #    - name: Publish glean
  #      run: |
  #        cd glean-core/rlb
  #        cargo publish --verbose
  #      env:
  #        CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  package-python-source:
    runs-on: ubuntu-latest
    steps:
      - &checkout
        uses: actions/checkout@v6

      - &rust-setup
        name: Set up Rust
        uses: dtolnay/rust-toolchain@67ef31d5b988238dd797d409d6f9574278e20537
        with:
          toolchain: stable

      - &python-setup
        name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.9"
          cache: 'pip'
          cache-dependency-path: |
            glean-core/python/requirements_dev.txt

      - name: Setup Python
        run: |
          make setup-python

      - name: Build Python source distribution
        run: |
          make build-python-sdist

      - uses: actions/upload-artifact@v4
        with:
          name: dist-source
          path: dist/

  package-python-linux:
    runs-on: ubuntu-latest
    steps:
      - *checkout
      - *rust-setup
      - *python-setup

      - name: Setup Python env
        run: |
            make setup-python

      - name: Build Python wheel
        run: |
            make build-python-wheel

      - uses: actions/upload-artifact@v4
        with:
          name: dist-linux
          path: dist/

  package-python-macos:
    runs-on: macos-latest
    steps:
      - *checkout
      - *rust-setup
      - *python-setup

      - name: Install additional targets
        run: |
          rustup target add aarch64-apple-darwin
          rustup target add x86_64-apple-darwin

      - name: Setup Python env
        run: |
            make setup-python

      - name: "Build Python wheel (aarch64)"
        run: |
            make build-python-wheel GLEAN_BUILD_TARGET=aarch64-apple-darwin

      - name: "Build Python wheel (x86_64)"
        run: |
            make build-python-wheel GLEAN_BUILD_TARGET=x86_64-apple-darwin

      - uses: actions/upload-artifact@v4
        with:
          name: dist-macos
          path: dist/

  package-python-windows:
    runs-on: windows-latest
    steps:
      - *checkout
      - *rust-setup
      - *python-setup

      - name: Setup Python env
        run: |
            make setup-python

      - name: Build Python wheel
        run: |
            make build-python-wheel GLEAN_BUILD_TARGET=x86_64-pc-windows-gnu

      - uses: actions/upload-artifact@v4
        with:
          name: dist-windows
          path: dist/

  package-python-aarch64:
    runs-on: ubuntu-latest
    steps:
      - *checkout
      - *rust-setup
      - *python-setup

      - name: Setup Python env
        run: |
            make setup-python
            .venv3.13/bin/pip install ziglang==0.15.2

      - name: Install additional targets
        run: |
          rustup target add aarch64-unknown-linux-gnu
          rustup target add aarch64-pc-windows-gnullvm

      - name: Build Python packages
        run: |
          . .venv3.13/bin/activate

          TARGETS="aarch64-unknown-linux-gnu aarch64-pc-windows-gnullvm"
          for target in $TARGETS; do
            make build-python-wheel GLEAN_BUILD_TARGET="$target" GLEAN_BUILD_EXTRA="--zig"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: dist-aarch64
          path: dist/

  publish-python:
    runs-on: ubuntu-latest
    needs:
      - package-python-source
      - package-python-linux
      - package-python-macos
      - package-python-windows
      - package-python-aarch64
    #environment: release
    #permissions:
    #  id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: dist-*

      - name: List content
        run: |
          list -R dist/

      #- name: Publish package distributions to PyPI
      #  uses: pypa/gh-action-pypi-publish@release/v1
