name: Release

on:
  push:
    tags: ['v*']

# Drop all default GITHUB_TOKEN permissions; each job declares its own least-privilege set.
permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package-python-source:
    runs-on: ubuntu-latest
    steps:
      - &checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - &rust-setup
        name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - &python-setup
        name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"
          cache: 'pip'
          cache-dependency-path: |
            glean-core/python/requirements_dev.txt

      - name: Setup Python
        run: |
          make setup-python

      - name: Build Python source distribution
        run: |
          make build-python-sdist

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: dist-source
          path: target/wheels/

  package-python-linux:
    runs-on: ubuntu-latest
    steps:
      - *checkout
      - *rust-setup
      - *python-setup

      - name: Setup Python env
        run: |
            make setup-python

      - name: Build Python wheel
        run: |
            make build-python-wheel

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-linux
          path: target/wheels/

  publish-python:
    runs-on: ubuntu-latest
    needs:
      - package-python-source
      - package-python-linux
    environment: release
    permissions:
      id-token: write
      contents: write  # to modify the release
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - name: List content
        run: |
          ls -R dist/

      - name: Upload Python wheels to release
        env:
          VERSION_TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$VERSION_TAG" dist/*

  publish-ios-framework:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # to modify the release
    steps:
      - *checkout

      - name: Build XCFramework
        run: |
          echo 1 > Glean.xcframework.zip

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Glean.xcframework.zip
          path: Glean.xcframework.zip

      - name: Upload XCFramework to release
        env:
          VERSION_TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$VERSION_TAG" Glean.xcframework.zip

  publish-glean-swift:
    runs-on: ubuntu-latest
    needs: [publish-ios-framework]
    steps:
      - *checkout

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: Glean.xcframework.zip
          skip-decompress: true

      - name: Release glean-swift
        env:
          VERSION_TAG: ${{ github.ref_name }}
        run: |
          git config --global user.email "jrediger@mozilla.com"
          git config --global user.name "Glean automated release"

          ls -l Glean.xcframework.zip

          echo ./bin/publish-glean-swift.sh "${VERSION_TAG}"

  sbom:
    name: SBOM
    permissions:
      actions: read   # Required by anchore/sbom-action to read workflow run context.
      contents: write # Required to upload the SBOM as a release asset.
    uses: mozilla/ssdlc-actions/.github/workflows/ssdlc-sbom.yml@0980dd214a92599ecdb67ad30f7086b508a3f825 # untagged; pinned to a main-branch commit
    with:
      sbom_name: glean-${{ github.ref_name || github.sha }}
