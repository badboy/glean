name: Build, Test, and Deploy

on:
  push:
    # branches:
      # - main
  pull_request:
    types:
      - opened
      - synchronize

# Drop all default GITHUB_TOKEN permissions; each job declares its own least-privilege set.
permissions: {}

env:
  PYTHON_VERSION: '3.14'
  MSRV: '1.90'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  decide-runs:
    name: Decide what checks to run based on changed files
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      rust-changed: ${{ steps.set-flags.outputs.rust-changed }}
      docs-changed: ${{ steps.set-flags.outputs.docs-changed }}
    steps:
      - &checkout-with-history
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false
          filter: blob:none
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - id: changed-files-rust
        uses: tj-actions/changed-files@22103cc46bda19c2b464ffe86db46df6922fd323  # v47.0.5
        with:
          files: |
            **/Cargo.toml
            **/Cargo.lock
            **/*.rs
          base_sha: ${{ github.event.pull_request.base.sha || github.event.before }}
      - id: changed-files-docs
        uses: tj-actions/changed-files@22103cc46bda19c2b464ffe86db46df6922fd323  # v47.0.5
        with:
          files: |
            **/*.md
          base_sha: ${{ github.event.pull_request.base.sha || github.event.before }}
      - name: Decide which jobs to run
        id: set-flags
        env:
          RUST_CHANGED: ${{ steps.changed-files-rust.outputs.any_changed }}
          DOCS_CHANGED: ${{ steps.changed-files-docs.outputs.any_changed }}
        run: |
          echo "rust-changed=$RUST_CHANGED" >> $GITHUB_OUTPUT
          echo "docs-changed=$DOCS_CHANGED" >> $GITHUB_OUTPUT

  test-rust:
    runs-on: ubuntu-latest
    needs: [decide-runs]
    if: needs.decide-runs.outputs.rust-changed == 'true'
    strategy:
      matrix:
        rust-version: ["stable", "1.90"]
    steps:
      - &checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false
          filter: blob:none
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@67ef31d5b988238dd797d409d6f9574278e20537
        with:
          toolchain: ${{ matrix.rust-version }}

      - uses: taiki-e/install-action@9e1e5806d4a4822de933115878265be9aaa786d9 # v2.82.2
        with:
          tool: nextest

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1

      - name: Install deps
        run: |
            sudo apt update
            sudo apt install --yes --no-install-recommends \
              faketime

      - name: Test
        run: |
          export RUST_BACKTRACE=1
          export RUST_LOG=glean_core=debug
          export CARGO_INCREMENTAL=0

          make test-rust

  spelling:
    runs-on: ubuntu-latest
    needs: [decide-runs]
    if: needs.decide-runs.outputs.docs-changed == 'true'
    steps:
      - *checkout

      - name: Install aspell
        run: |
          sudo apt update
          sudo apt install aspell aspell-en

      - name: Check documentation spelling
        run: bin/spellcheck.sh list

  docs:
    runs-on: ubuntu-latest
    needs: [decide-runs]
    if: needs.decide-runs.outputs.docs-changed == 'true'
    steps:
      - *checkout
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@67ef31d5b988238dd797d409d6f9574278e20537
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1
        with:
          cache-bin: true

      - name: Set up Python
        id: setup_python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.10"
          cache: 'pip'
          cache-dependency-path: |
            glean-core/python/requirements_dev.txt

      - name: Install mdbook-dtmo
        run: |
          cargo install mdbook-dtmo --version 0.15.2
          cp ~/.cargo/bin/mdbook-dtmo ~/.cargo/bin/mdbook

      - name: Version information
        run: |
          rustc --version
          cargo --version
          rustup --version
          mdbook --version

      - name: Build Rust documentation
        run: |
          bin/build-rust-docs.sh

      - name: Generate Python docs
        run: |
          make docs-python

      - name: Install linkchecker
        run: |
          npm install link-checker

      - name: Check internal documentation links
        run: |
          make linkcheck-raw

  test-python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps: &python-test-steps
      - *checkout

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@67ef31d5b988238dd797d409d6f9574278e20537
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1

      - name: Set up Python
        id: setup_python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: |
            glean-core/python/requirements_dev.txt

      - name: Python tests
        if: runner.os != 'Windows'
        run: |
          make test-python

      - name: "Python tests (Windows)"
        if: runner.os == 'Windows'
        run: |
          python3 -m venv venv
          .\venv\Scripts\pip install --upgrade pip wheel setuptools
          .\venv\Scripts\pip install -r glean-core\python\requirements_dev.txt

          .\venv\Scripts\py.test -v glean-core\python\tests

  test-python-windows:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.9"]
    steps: *python-test-steps

